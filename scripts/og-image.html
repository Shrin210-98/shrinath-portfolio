<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #1c1917;
        color: #e7e5e4;
        font-family: "JetBrains Mono", monospace;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        border-top: 10px solid #fbbf24;
      }
      .prompt { font-size: 30px; color: #a8a29e; }
      .prompt b { color: #fbbf24; font-weight: 500; }
      h1 { margin-top: 36px; font-size: 92px; font-weight: 700; color: #fbbf24; letter-spacing: -2px; line-height: 1.05; }

      .cursor { display: inline-block; width: 22px; height: 44px; background: #fbbf24; margin-left: 12px; }
      .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font-size: 28px; color: #a8a29e; }
      .mono { width: 96px; height: 96px; }
    </style>
  </head>

    <p class="prompt"><b>~</b> $ whoami</p>
    <h1>Shrinath Poojary</h1>

      <span>shrinath.pages.dev · Mumbai, India</span>
