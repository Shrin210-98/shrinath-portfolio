    <!-- Sets the theme class before first paint (no flash). If you edit this script,
         `npm run build` will tell you the new CSP hash to put in public/_headers. -->
    <script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d)})()</script>
